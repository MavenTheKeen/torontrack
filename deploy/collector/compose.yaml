# Collector server: PostgreSQL and the live collectors only. Everything else (site,
# Airflow, dbt, the other loaders) runs on the development machine, which subscribes to
# the collected tables through PostgreSQL logical replication (docs/collector.md).
#
# The app image is built on the development machine and loaded here; this directory holds
# only this file and .env (POSTGRES_PASSWORD).
name: toronto-transit

x-app: &app
  image: toronto-transit-app:local
  environment: &app-environment
    DATABASE_URL: postgresql://transit:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/transit
    GBFS_DISCOVERY_URL: ${GBFS_DISCOVERY_URL:-https://toronto.publicbikesystem.net/customer/gbfs/v3.0/gbfs.json}
    TZ: UTC
  depends_on:
    postgres:
      condition: service_healthy
    init-db:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    # Logical replication to the development machine. While it is offline, its slot keeps
    # the changes it has not received, capped so the server's disk cannot fill.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=20GB"]
    environment:
      POSTGRES_USER: transit
      POSTGRES_DB: transit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Reached only through SSH from the development machine.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  init-db:
    <<: *app
    command: ["init-db"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ttc-collector:
    <<: *app
    command: ["ttc-collect"]
    environment:
      <<: *app-environment
      TTC_POLL_SECONDS: 30
      TTC_FAST_POLL_SECONDS: 10
      TTC_RAW_RETENTION_DAYS: 3
      TTC_VEHICLE_RAW_RETENTION_HOURS: 6
      TTC_EVENT_RETENTION_DAYS: 90
    healthcheck:
      test: ["CMD", "transit", "ttc-health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    stop_grace_period: 40s

  # Schedules that Airflow runs in the full stack, as loops aligned to the clock. A failed
  # run is recorded by the command itself and the loop continues.
  bikeshare-collector:
    <<: *app
    entrypoint: ["sh", "-c"]
    command: ['while :; do transit collect || echo "collect failed"; sleep $$((900 - $$(date +%s) % 900)); done']

  roads-collector:
    <<: *app
    entrypoint: ["sh", "-c"]
    command: ['while :; do transit roads-refresh || echo "roads-refresh failed"; sleep $$((600 - $$(date +%s) % 600)); done']

  # The TTC collector keys everything to the current schedule; reload it when TTC
  # publishes a new one (checked every 6 hours, skipped when unchanged).
  ttc-schedule:
    <<: *app
    entrypoint: ["sh", "-c"]
    command: ['while :; do transit ttc-gtfs-refresh || echo "ttc-gtfs-refresh failed"; sleep $$((21600 - $$(date +%s) % 21600)); done']

volumes:
  postgres-data:
