[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "torontrack"
version = "0.1.0"
description = "Traceable Toronto Bike Share GBFS collection and reliability monitoring"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "psycopg[binary]==3.2.10",
  "streamlit==1.54.0",
  "pillow==12.3.0", # Security fixes for Streamlit's image dependency.
  "pandas==2.3.3",
  "tzdata==2025.2",
  "gtfs-realtime-bindings==2.2.0",
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pyarrow==26.0.0", # Open-data Parquet and CSV files (already locked via Streamlit).
  "pmtiles==3.8.1",
  "ijson==3.3.0", # Streams the 225 MB city events feed instead of loading it whole.
  "osmium==4.3.1", # Reads the OpenStreetMap extract for station entrances and parking.
]

[project.scripts]
transit = "transit.cli:main"

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.14.2"]
browser = ["playwright==1.56.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/transit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database", "live: explicitly fetches live public GBFS", "airflow: real Airflow DAG import/structure checks; Linux Airflow environment required"]
addopts = "-ra"
cache_dir = ".local/pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
