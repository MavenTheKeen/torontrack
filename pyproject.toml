[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "torontrack"
version = "0.1.0"
description = "Live map and reliability tracker for Toronto transit"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "streamlit==1.66.1",
  "pillow==13.0.0", # Security fixes for Streamlit's image dependency.
  "pandas==2.3.3",
  "tzdata==2025.3",
  "gtfs-realtime-bindings==2.2.0",
  "fastapi==0.146.0",
  "uvicorn==0.54.0",
  "pyarrow==26.0.0", # Open-data Parquet and CSV files (already locked via Streamlit).
  "pmtiles==3.8.1",
  "ijson==3.6.0", # Streams the 225 MB city events feed instead of loading it whole.
  "osmium==4.3.2", # Reads the OpenStreetMap extract for station entrances and parking.
]

[project.scripts]
transit = "transit.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1"]
browser = ["playwright==1.64.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/transit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database", "live: explicitly fetches live public GBFS", "airflow: real Airflow DAG import/structure checks; Linux Airflow environment required"]
addopts = "-ra"
cache_dir = ".local/pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
