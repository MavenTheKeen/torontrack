name: toronto-transit

x-app: &app
  image: toronto-transit-app:local
  build:
    context: .
  # Secrets are files in ./secrets (deploy/make_secrets.sh), mounted in /run/secrets, so
  # they are not in the containers' environment (docs/deploy.md#secrets).
  secrets: [postgres_password]
  environment: &app-environment
    DATABASE_URL: postgresql://transit@postgres:5432/transit
    DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    GBFS_DISCOVERY_URL: ${GBFS_DISCOVERY_URL:-https://toronto.publicbikesystem.net/customer/gbfs/v3.0/gbfs.json}
    TZ: UTC

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    environment:
      POSTGRES_USER: transit
      POSTGRES_DB: transit
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: UTC
      PGTZ: UTC
    secrets: [postgres_password]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  init-db:
    <<: *app
    command: ["init-db"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  collector:
    <<: *app
    profiles: ["tools"]
    command: ["collect"]
    depends_on:
      postgres:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    restart: "no"

  dashboard:
    <<: *app
    entrypoint: ["streamlit"]
    command:
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      postgres:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  ttc-collector:
    <<: *app
    command: ["ttc-collect"]
    environment:
      <<: *app-environment
      TTC_POLL_SECONDS: ${TTC_POLL_SECONDS:-30}
      # Subway predictions and vehicle positions (docs/ttc.md).
      TTC_FAST_POLL_SECONDS: ${TTC_FAST_POLL_SECONDS:-10}
      TTC_RAW_RETENTION_DAYS: ${TTC_RAW_RETENTION_DAYS:-3}
      TTC_VEHICLE_RAW_RETENTION_HOURS: ${TTC_VEHICLE_RAW_RETENTION_HOURS:-6}
      TTC_EVENT_RETENTION_DAYS: ${TTC_EVENT_RETENTION_DAYS:-90}
    depends_on:
      postgres:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "transit", "ttc-health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    stop_grace_period: 40s

  # Brampton Transit, MiWay and York Region Transit bus positions every 15 s (docs/agencies.md).
  agencies-collector:
    <<: *app
    command: ["agencies-collect"]
    depends_on:
      postgres:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "transit", "agencies-health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 180s
    restart: unless-stopped
    stop_grace_period: 20s

  alerts:
    <<: *app
    command: ["alerts"]
    environment:
      <<: *app-environment
      # Phone notifications (see docs/alerts.md); without NTFY_URL they are only recorded.
      NTFY_URL_FILE: /run/secrets/ntfy_url
      HEARTBEAT_URL_FILE: /run/secrets/heartbeat_url
    secrets: [postgres_password, ntfy_url, heartbeat_url]
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      init-db:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 20s

  web:
    <<: *app
    entrypoint: ["uvicorn"]
    command:
      - transit.web.app:app
      - --host=0.0.0.0
      - --port=8000
      - --no-server-header
    environment:
      <<: *app-environment
      WEB_RATE_LIMIT_PER_MINUTE: ${WEB_RATE_LIMIT_PER_MINUTE:-120}
      EXPORT_DIR: /srv/open-data
      MAP_DIR: /srv/map
      # The optional trip planner; the map hides directions while it is not running.
      PLANNER_URL: ${PLANNER_URL:-http://planner:8080}
    volumes:
      # Open-data files written daily by Airflow's export task; served at /data/.
      - open-data:/srv/open-data:ro
      # The street map built by the map-tiles tool; served at /map-data/.
      - map-data:/srv/map:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  dbt:
    image: toronto-transit-transform:local
    build:
      context: .
      dockerfile: docker/transform.Dockerfile
    profiles: ["tools"]
    environment: *app-environment
    secrets: [postgres_password]
    depends_on:
      postgres:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    restart: "no"

  # One-off: build or refresh the Toronto street map (docs/map.md).
  map-tiles:
    <<: *app
    profiles: ["tools"]
    command: ["map-tiles", "--out", "/srv/map"]
    volumes:
      - map-data:/srv/map
    restart: "no"

  # Optional trip planner (docs/planner.md): `docker compose --profile planner up -d`
  # downloads its inputs, builds the routing graph (about 4 minutes) and serves it. The
  # download runs in the Airflow image so it writes as the same user as the daily
  # planner_data DAG, which shares the volume.
  planner-data:
    image: toronto-transit-airflow:local
    build:
      context: .
      dockerfile: airflow/Dockerfile
    profiles: ["planner"]
    entrypoint: ["/opt/app-venv/bin/transit"]
    command: ["planner-data", "--out", "/opt/airflow/planner"]
    volumes:
      - planner-data:/opt/airflow/planner
    restart: "no"

  planner:
    image: opentripplanner/opentripplanner:2.10.0@sha256:8d54e5c589186707ee365417f2202dc878c451fa3001b8edff07019531100933
    profiles: ["planner"]
    entrypoint: ["/bin/bash", "/planner.sh"]
    environment:
      JAVA_OPTS: ${PLANNER_JAVA_OPTS:--Xmx2g}
      BUILD_JAVA_OPTS: ${PLANNER_BUILD_JAVA_OPTS:--Xmx4g}
    volumes:
      - planner-data:/var/opentripplanner
      - ./docker/planner.sh:/planner.sh:ro
    depends_on:
      planner-data:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 60s
      timeout: 5s
      retries: 3
      # The first start builds the graph before serving.
      start_period: 15m
    restart: unless-stopped
    stop_grace_period: 30s

  airflow-db-init:
    <<: *app
    profiles: ["airflow"]
    entrypoint: ["python"]
    command: ["scripts/init_airflow_db.py"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow:
    image: toronto-transit-airflow:local
    build:
      context: .
      dockerfile: airflow/Dockerfile
    profiles: ["airflow"]
    environment:
      <<: *app-environment
      AIRFLOW_CONFIG: /opt/airflow/state/airflow.cfg
      # Airflow reads its metadata connection from this command's output, so the password
      # stays in the secret file.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: >-
        sh -c 'printf "postgresql+psycopg2://transit:%s@postgres:5432/airflow_metadata"
        "$$(cat /run/secrets/postgres_password)"'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__API__WORKERS: "1"
      AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
      EXPORT_DIR: /opt/airflow/open-data
      # Concerts and games for the Events page (docs/events.md); optional.
      TICKETMASTER_API_KEY_FILE: /run/secrets/ticketmaster_api_key
    secrets: [postgres_password, ticketmaster_api_key]
    command: ["standalone"]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - airflow-logs:/opt/airflow/logs
      - airflow-state:/opt/airflow/state
      - open-data:/opt/airflow/open-data
      - planner-data:/opt/airflow/planner
    depends_on:
      postgres:
        condition: service_healthy
        # Standalone's scheduler exits on a dropped database connection and is not
        # restarted inside the container, so restart Airflow whenever Compose restarts
        # or recreates PostgreSQL.
        restart: true
      init-db:
        condition: service_completed_successfully
      airflow-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "/opt/airflow/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    stop_grace_period: 30s

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  ticketmaster_api_key:
    file: ./secrets/ticketmaster_api_key
  ntfy_url:
    file: ./secrets/ntfy_url
  heartbeat_url:
    file: ./secrets/heartbeat_url

volumes:
  postgres-data:
  airflow-logs:
  airflow-state:
  open-data:
  map-data:
  planner-data:
