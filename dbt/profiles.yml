transit:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('DBT_HOST', '127.0.0.1') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'transit') }}"
      password: "{{ env_var('DBT_PASSWORD', '') }}"
      dbname: "{{ env_var('DBT_DATABASE', 'transit') }}"
      schema: analytics
      threads: 2
      connect_timeout: 10
      retries: 1
      sslmode: "{{ env_var('DBT_SSLMODE', 'prefer') }}"
